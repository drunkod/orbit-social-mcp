name: CAFE MCP — Original UI and Live Plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orbit:
    name: Effect + MCP MVP checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install Orbit dependencies
        run: pnpm install --filter @cafe/live-mcp... --filter @cafe/frontend... --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @cafe/live-mcp typecheck
      - name: Build browser UI
        run: pnpm --filter @cafe/live-mcp build
      - name: Run unit tests
        run: pnpm --filter @cafe/live-mcp test
      - name: Check original CAFE Story and Scene tests
        run: pnpm --filter @cafe/frontend test
