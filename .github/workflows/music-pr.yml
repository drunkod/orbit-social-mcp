name: CAFE + StrudelLM MCP — Tests, Browser Demo

on:
  push:
    branches: [main]
    paths:
      - 'packages/live-mcp/**'
      - 'integrations/strudellm/**'
      - 'scripts/test-music-pr.sh'
      - '.github/workflows/music-pr.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/live-mcp/**'
      - 'integrations/strudellm/**'
      - 'scripts/test-music-pr.sh'
      - '.github/workflows/music-pr.yml'
  workflow_dispatch:

concurrency:
  group: music-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-and-demo:
    name: TDD, local infrastructure, recorded demo
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install CAFE workspace from lockfile
        run: pnpm install --frozen-lockfile
      - name: Install the full upstream StrudelLM from its npm lockfile
        working-directory: integrations/strudellm
        run: npm ci
      - name: CAFE AGENTS.md — typecheck, lint and Story/Scene tests
        run: |
          pnpm typecheck
          pnpm lint
          pnpm --filter @cafe/frontend test
      - name: MCP music API tests and schemas
        run: |
          pnpm --filter @cafe/live-mcp typecheck
          pnpm --filter @cafe/live-mcp test
      - name: Original StrudelLM agent workflow — lint and production build
        working-directory: integrations/strudellm
        run: |
          npm run lint
          BETTER_AUTH_SECRET="$(openssl rand -hex 32)" npm run build
      - name: Build the original CAFE frontend
        run: pnpm --filter @cafe/live-mcp build
      - name: Install Playwright browser, audio codecs and recording helper
        run: pnpm --filter @cafe/live-mcp exec playwright install --with-deps chromium ffmpeg
      - name: Original CAFE chat + MCP + Strudel Studio browser tests and real review video
        env:
          MUSIC_ARTIFACT_DIR: /tmp/cafe-music-review
        run: bash scripts/test-music-pr.sh
      - name: Upload music demo, browser screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strudel-mcp-music-pr-demo
          path: /tmp/cafe-music-review/
          if-no-files-found: warn
          retention-days: 30
      - name: Comment review video on pull request
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = context.issue.number
            const runUrl = 'https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId + '#artifacts'
            const marker = '<!-- cafe-strudellm-mcp-demo -->'
            const body = marker + '\n🎵 **StrudelLM × CAFE music demo passed.**' +
              '\n\n[Download recorded Playwright video, desktop/mobile screenshots and logs](' + runUrl + ')' +
              '\n\nVerified: MCP tools, generated Strudel source, playback acknowledgement, interactive sliders, original CAFE chat and plugin regression.' +
              '\n\n_This artifact is from an isolated CI test environment; a per-PR Cloudflare preview requires separate deployment credentials._'
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const prev = comments.find(c => c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker))
            if (prev) await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })
