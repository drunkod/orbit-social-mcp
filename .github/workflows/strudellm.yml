name: StrudelLM — Upstream Workflow + Music Studio

on:
  push:
    branches: [main]
    paths:
      - 'integrations/strudellm/**'
      - '.github/workflows/strudellm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'integrations/strudellm/**'
      - '.github/workflows/strudellm.yml'

jobs:
  lint:
    name: Original StrudelLM lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/strudellm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/strudellm/package-lock.json
      - run: npm ci
      - run: npm run lint

  build:
    name: Original StrudelLM build and TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/strudellm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/strudellm/package-lock.json
      - run: npm ci
      - run: npm run build
